<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실험실 소모품 관리 시스템</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .tab-btn { border-bottom: 2px solid transparent; color: #6b7280; }
  .tab-btn.active { border-bottom: 2px solid #2563eb; color: #2563eb; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .toast { position: fixed; bottom: 24px; right: 24px; z-index: 9999; padding: 12px 20px; border-radius: 8px; color: white; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.success { background: #16a34a; }
  .toast.error { background: #dc2626; }
  .badge-ok { background:#dcfce7; color:#16a34a; }
  .badge-low { background:#fef9c3; color:#ca8a04; }
  .badge-out { background:#fee2e2; color:#dc2626; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- 헤더 -->
<header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-3">
  <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
    </svg>
  </div>
  <h1 class="text-lg font-bold text-gray-800">실험실 소모품 관리 시스템</h1>
</header>

<!-- 탭 네비게이션 -->
<nav class="bg-white border-b border-gray-200 px-6 flex gap-1">
  <button onclick="switchTab('inventory')" id="tab-inventory" class="tab-btn active px-4 py-3 text-sm font-medium">재고 현황</button>
  <button onclick="switchTab('register')" id="tab-register" class="tab-btn px-4 py-3 text-sm font-medium">소모품 등록</button>
  <button onclick="switchTab('transaction')" id="tab-transaction" class="tab-btn px-4 py-3 text-sm font-medium">입출고</button>
  <button onclick="switchTab('history')" id="tab-history" class="tab-btn px-4 py-3 text-sm font-medium">거래 내역</button>
</nav>

<main class="max-w-7xl mx-auto px-4 py-6">

  <!-- ===== 재고 현황 탭 ===== -->
  <div id="content-inventory" class="tab-content active">
    <!-- 검색/필터 -->
    <div class="flex flex-wrap gap-2 mb-4">
      <input id="searchInput" type="text" placeholder="품명 검색..." oninput="renderInventory()"
        class="flex-1 min-w-[200px] px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white">
      <select id="filterCategory" onchange="renderInventory()"
        class="px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white min-w-[130px]">
        <option value="">전체 분류</option>
      </select>
      <select id="filterStatus" onchange="renderInventory()"
        class="px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white min-w-[120px]">
        <option value="">전체 상태</option>
        <option value="ok">정상</option>
        <option value="low">재고 부족</option>
        <option value="out">재고 소진</option>
      </select>
      <button onclick="loadItems()" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">새로고침</button>
    </div>

    <!-- 통계 카드 -->
    <div class="grid grid-cols-3 gap-3 mb-4">
      <div class="bg-white border border-gray-200 rounded-lg p-4">
        <div class="text-xs text-gray-500 mb-1">전체 품목</div>
        <div id="statTotal" class="text-2xl font-bold text-gray-800">-</div>
      </div>
      <div class="bg-white border border-yellow-300 rounded-lg p-4">
        <div class="text-xs text-gray-500 mb-1">재고 부족</div>
        <div id="statLow" class="text-2xl font-bold text-yellow-500">-</div>
      </div>
      <div class="bg-white border border-red-300 rounded-lg p-4">
        <div class="text-xs text-gray-500 mb-1">재고 소진</div>
        <div id="statOut" class="text-2xl font-bold text-red-500">-</div>
      </div>
    </div>

    <!-- 테이블 -->
    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="text-left px-4 py-3 text-gray-600 font-semibold">품명</th>
            <th class="text-left px-4 py-3 text-gray-600 font-semibold">분류</th>
            <th class="text-left px-4 py-3 text-gray-600 font-semibold">단위</th>
            <th class="text-right px-4 py-3 text-gray-600 font-semibold">현재고</th>
            <th class="text-right px-4 py-3 text-gray-600 font-semibold">최소재고</th>
            <th class="text-center px-4 py-3 text-gray-600 font-semibold">상태</th>
            <th class="text-center px-4 py-3 text-gray-600 font-semibold">관리</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody">
          <tr><td colspan="7" class="text-center py-10 text-gray-400">데이터 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ===== 소모품 등록 탭 ===== -->
  <div id="content-register" class="tab-content">
    <div class="max-w-lg bg-white border border-gray-200 rounded-lg p-6">
      <h2 class="text-base font-semibold text-gray-800 mb-4">새 소모품 등록</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-sm text-gray-600 mb-1">품명 *</label>
          <input id="regName" type="text" placeholder="예: 50mL 팔콘튜브"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">분류 *</label>
          <input id="regCategory" type="text" placeholder="예: 튜브/병"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">단위</label>
          <input id="regUnit" type="text" placeholder="예: 개, box, 팩"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm text-gray-600 mb-1">현재 재고</label>
            <input id="regStock" type="number" min="0" value="0"
              class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">최소 재고</label>
            <input id="regMinStock" type="number" min="0" value="0"
              class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
          </div>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">비고</label>
          <input id="regNote" type="text" placeholder="선택사항"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
        </div>
        <button onclick="registerItem()"
          class="w-full py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700">
          등록하기
        </button>
      </div>
    </div>
  </div>

  <!-- ===== 입출고 탭 ===== -->
  <div id="content-transaction" class="tab-content">
    <div class="max-w-lg bg-white border border-gray-200 rounded-lg p-6">
      <h2 class="text-base font-semibold text-gray-800 mb-4">입출고 처리</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-sm text-gray-600 mb-1">품목 선택 *</label>
          <select id="txItem" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
            <option value="">품목을 선택하세요</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-2">구분 *</label>
          <div class="flex gap-2">
            <button onclick="setTxType('in')" id="btnIn"
              class="flex-1 py-2 text-sm font-medium rounded-lg border border-gray-200 text-gray-600 hover:bg-blue-50 hover:border-blue-400 hover:text-blue-600">
              입고
            </button>
            <button onclick="setTxType('out')" id="btnOut"
              class="flex-1 py-2 text-sm font-medium rounded-lg border border-gray-200 text-gray-600 hover:bg-red-50 hover:border-red-400 hover:text-red-600">
              출고
            </button>
          </div>
          <input type="hidden" id="txType" value="">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">수량 *</label>
          <input id="txQty" type="number" min="1" value="1"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">담당자</label>
          <input id="txHandler" type="text" placeholder="이름 입력"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">비고</label>
          <input id="txNote" type="text" placeholder="선택사항"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
        </div>
        <button onclick="submitTransaction()"
          class="w-full py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700">
          처리하기
        </button>
      </div>
    </div>
  </div>

  <!-- ===== 거래 내역 탭 ===== -->
  <div id="content-history" class="tab-content">
    <div class="flex flex-wrap gap-2 mb-4">
      <select id="historyItem" onchange="renderHistory()"
        class="px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white min-w-[200px]">
        <option value="">전체 품목</option>
      </select>
      <select id="historyType" onchange="renderHistory()"
        class="px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white">
        <option value="">전체</option>
        <option value="in">입고</option>
        <option value="out">출고</option>
      </select>
    </div>
    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="text-left px-4 py-3 text-gray-600 font-semibold">품명</th>
            <th class="text-center px-4 py-3 text-gray-600 font-semibold">구분</th>
            <th class="text-right px-4 py-3 text-gray-600 font-semibold">수량</th>
            <th class="text-right px-4 py-3 text-gray-600 font-semibold">처리 후 재고</th>
            <th class="text-left px-4 py-3 text-gray-600 font-semibold">담당자</th>
            <th class="text-left px-4 py-3 text-gray-600 font-semibold">비고</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
          <tr><td colspan="6" class="text-center py-10 text-gray-400">데이터 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<!-- 삭제 확인 모달 -->
<div id="deleteModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl p-6 max-w-sm w-full">
    <h3 class="text-base font-semibold text-gray-800 mb-2">소모품 삭제</h3>
    <p class="text-sm text-gray-600 mb-4"><span id="deleteItemName" class="font-medium"></span>을(를) 삭제할까요?</p>
    <div class="flex gap-2">
      <button onclick="closeDeleteModal()" class="flex-1 py-2 text-sm border border-gray-200 rounded-lg hover:bg-gray-50">취소</button>
      <button onclick="confirmDelete()" class="flex-1 py-2 text-sm bg-red-600 text-white rounded-lg hover:bg-red-700">삭제</button>
    </div>
  </div>
</div>

<!-- 편집 모달 -->
<div id="editModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl p-6 max-w-sm w-full">
    <h3 class="text-base font-semibold text-gray-800 mb-4">소모품 수정</h3>
    <input type="hidden" id="editId">
    <div class="space-y-3">
      <div>
        <label class="block text-sm text-gray-600 mb-1">품명</label>
        <input id="editName" type="text" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">분류</label>
        <input id="editCategory" type="text" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">단위</label>
        <input id="editUnit" type="text" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm text-gray-600 mb-1">현재 재고</label>
          <input id="editStock" type="number" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">최소 재고</label>
          <input id="editMinStock" type="number" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg">
        </div>
      </div>
    </div>
    <div class="flex gap-2 mt-4">
      <button onclick="closeEditModal()" class="flex-1 py-2 text-sm border border-gray-200 rounded-lg hover:bg-gray-50">취소</button>
      <button onclick="confirmEdit()" class="flex-1 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">저장</button>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div id="toast" class="toast"></div>

<script>
  // ── Supabase 초기화 ──────────────────────────────────────────────────────
  const SUPABASE_URL = 'https://hjtfrbwakcjpqcrztpij.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqdGZyYndha2NqcHFjcnp0cGlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NDYxNTUsImV4cCI6MjA5NTUyMjE1NX0.8d8bkHFYFV8BrR4kR-OHg3NiOTqBiXDPdeTM5q513RA';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ── 전역 데이터 ───────────────────────────────────────────────────────────
  let items = [];
  let transactions = [];
  let deleteTargetId = null;

  // ── 초기 로드 ─────────────────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    loadItems();
    loadTransactions();
  });

  // ── 탭 전환 ───────────────────────────────────────────────────────────────
  function switchTab(id) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('content-' + id).classList.add('active');
    document.getElementById('tab-' + id).classList.add('active');

    if (id === 'transaction') populateTxSelect();
    if (id === 'history') { populateHistorySelect(); renderHistory(); }
  }

  // ── 데이터 로드 ───────────────────────────────────────────────────────────
  async function loadItems() {
    const { data, error } = await db.from('items').select('*').order('name');
    if (error) { showToast('items 로드 오류: ' + error.message, 'error'); return; }
    items = data || [];
    renderInventory();
    syncCategoryFilter();
  }

  async function loadTransactions() {
    const { data, error } = await db.from('transactions').select('*').order('id', { ascending: false });
    if (error) { showToast('거래내역 로드 오류: ' + error.message, 'error'); return; }
    transactions = data || [];
    renderHistory();
  }

  // ── 카테고리 필터 동기화 ──────────────────────────────────────────────────
  function syncCategoryFilter() {
    const sel = document.getElementById('filterCategory');
    const cats = [...new Set(items.map(i => i.category).filter(Boolean))].sort();
    const current = sel.value;
    sel.innerHTML = '<option value="">전체 분류</option>'
      + cats.map(c => `<option value="${c}"${c === current ? ' selected' : ''}>${c}</option>`).join('');
  }

  // ── 재고 현황 렌더링 ──────────────────────────────────────────────────────
  function renderInventory() {
    const search = (document.getElementById('searchInput').value || '').toLowerCase();
    const cat    = document.getElementById('filterCategory').value;
    const status = document.getElementById('filterStatus').value;

    let filtered = items.filter(item => {
      const matchName = !search || (item.name || '').toLowerCase().includes(search);
      const matchCat  = !cat    || item.category === cat;
      const st        = getStatus(item);
      const matchSt   = !status || st === status;
      return matchName && matchCat && matchSt;
    });

    document.getElementById('statTotal').textContent = items.length;
    document.getElementById('statLow').textContent   = items.filter(i => getStatus(i) === 'low').length;
    document.getElementById('statOut').textContent   = items.filter(i => getStatus(i) === 'out').length;

    const tbody = document.getElementById('inventoryTableBody');
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-10 text-gray-400">등록된 소모품이 없습니다.</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(item => {
      const st = getStatus(item);
      const badge = st === 'ok'
        ? '<span class="badge-ok px-2 py-0.5 rounded text-xs font-medium">정상</span>'
        : st === 'low'
        ? '<span class="badge-low px-2 py-0.5 rounded text-xs font-medium">부족</span>'
        : '<span class="badge-out px-2 py-0.5 rounded text-xs font-medium">소진</span>';
      return `<tr class="border-b border-gray-100 hover:bg-gray-50">
        <td class="px-4 py-3 font-medium text-gray-800">${item.name || ''}</td>
        <td class="px-4 py-3 text-gray-500">${item.category || ''}</td>
        <td class="px-4 py-3 text-gray-500">${item.unit || ''}</td>
        <td class="px-4 py-3 text-right font-semibold">${item.stock ?? 0}</td>
        <td class="px-4 py-3 text-right text-gray-500">${item.min_stock ?? 0}</td>
        <td class="px-4 py-3 text-center">${badge}</td>
        <td class="px-4 py-3 text-center">
          <button onclick="openEditModal('${item.id}')" class="text-xs text-blue-600 hover:underline mr-2">수정</button>
          <button onclick="openDeleteModal('${item.id}','${(item.name||'').replace(/'/g,"\'")}') " class="text-xs text-red-500 hover:underline">삭제</button>
        </td>
      </tr>`;
    }).join('');
  }

  function getStatus(item) {
    const s = item.stock ?? 0;
    const m = item.min_stock ?? 0;
    if (s <= 0) return 'out';
    if (s <= m) return 'low';
    return 'ok';
  }

  // ── 소모품 등록 ───────────────────────────────────────────────────────────
  async function registerItem() {
    const name     = document.getElementById('regName').value.trim();
    const category = document.getElementById('regCategory').value.trim();
    const unit     = document.getElementById('regUnit').value.trim();
    const stock    = parseInt(document.getElementById('regStock').value) || 0;
    const minStock = parseInt(document.getElementById('regMinStock').value) || 0;
    const note     = document.getElementById('regNote').value.trim();

    if (!name || !category) { showToast('품명과 분류는 필수입니다.', 'error'); return; }

    const { error } = await db.from('items').insert([{ name, category, unit, stock, min_stock: minStock, note }]);
    if (error) { showToast('등록 오류: ' + error.message, 'error'); return; }

    showToast(name + ' 등록 완료!', 'success');
    ['regName','regCategory','regUnit','regNote'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('regStock').value = '0';
    document.getElementById('regMinStock').value = '0';
    loadItems();
  }

  // ── 입출고 처리 ───────────────────────────────────────────────────────────
  function populateTxSelect() {
    const sel = document.getElementById('txItem');
    sel.innerHTML = '<option value="">품목을 선택하세요</option>'
      + items.map(i => `<option value="${i.id}" data-stock="${i.stock}" data-name="${i.name}">${i.name} (현재: ${i.stock ?? 0}${i.unit ? ' '+i.unit : ''})</option>`).join('');
  }

  function setTxType(type) {
    document.getElementById('txType').value = type;
    const btnIn  = document.getElementById('btnIn');
    const btnOut = document.getElementById('btnOut');
    if (type === 'in') {
      btnIn.className  = 'flex-1 py-2 text-sm font-medium rounded-lg border border-blue-500 bg-blue-50 text-blue-600';
      btnOut.className = 'flex-1 py-2 text-sm font-medium rounded-lg border border-gray-200 text-gray-600 hover:bg-red-50 hover:border-red-400 hover:text-red-600';
    } else {
      btnOut.className = 'flex-1 py-2 text-sm font-medium rounded-lg border border-red-500 bg-red-50 text-red-600';
      btnIn.className  = 'flex-1 py-2 text-sm font-medium rounded-lg border border-gray-200 text-gray-600 hover:bg-blue-50 hover:border-blue-400 hover:text-blue-600';
    }
  }

  async function submitTransaction() {
    const sel     = document.getElementById('txItem');
    const itemId  = sel.value;
    const type    = document.getElementById('txType').value;
    const qty     = parseInt(document.getElementById('txQty').value) || 0;
    const handler = document.getElementById('txHandler').value.trim();
    const note    = document.getElementById('txNote').value.trim();

    if (!itemId) { showToast('품목을 선택하세요.', 'error'); return; }
    if (!type)   { showToast('입고/출고를 선택하세요.', 'error'); return; }
    if (qty <= 0){ showToast('수량을 1 이상 입력하세요.', 'error'); return; }

    const item = items.find(i => i.id === itemId);
    if (!item) { showToast('품목을 찾을 수 없습니다.', 'error'); return; }

    const currentStock = item.stock ?? 0;
    if (type === 'out' && qty > currentStock) {
      showToast('출고 수량이 현재 재고보다 많습니다. (현재: ' + currentStock + ')', 'error');
      return;
    }

    const newStock = type === 'in' ? currentStock + qty : currentStock - qty;

    const { error: txErr } = await db.from('transactions').insert([{
      item_id: itemId,
      item_name: item.name,
      type,
      quantity: qty,
      stock_after: newStock,
      handler: handler || null,
      note: note || null
    }]);
    if (txErr) { showToast('입출고 오류: ' + txErr.message, 'error'); return; }

    const { error: upErr } = await db.from('items').update({ stock: newStock }).eq('id', itemId);
    if (upErr) { showToast('재고 업데이트 오류: ' + upErr.message, 'error'); return; }

    showToast((type === 'in' ? '입고' : '출고') + ' 처리 완료!', 'success');
    document.getElementById('txItem').value = '';
    document.getElementById('txType').value = '';
    document.getElementById('txQty').value = '1';
    document.getElementById('txHandler').value = '';
    document.getElementById('txNote').value = '';
    setTxType('');
    document.getElementById('btnIn').className = 'flex-1 py-2 text-sm font-medium rounded-lg border border-gray-200 text-gray-600 hover:bg-blue-50 hover:border-blue-400 hover:text-blue-600';
    document.getElementById('btnOut').className = 'flex-1 py-2 text-sm font-medium rounded-lg border border-gray-200 text-gray-600 hover:bg-red-50 hover:border-red-400 hover:text-red-600';
    await loadItems();
    await loadTransactions();
    populateTxSelect();
  }

  // ── 거래 내역 ─────────────────────────────────────────────────────────────
  function populateHistorySelect() {
    const sel = document.getElementById('historyItem');
    const cur = sel.value;
    sel.innerHTML = '<option value="">전체 품목</option>'
      + items.map(i => `<option value="${i.id}"${i.id === cur ? ' selected' : ''}>${i.name}</option>`).join('');
  }

  function renderHistory() {
    const itemId = document.getElementById('historyItem').value;
    const type   = document.getElementById('historyType').value;

    let filtered = transactions.filter(t => {
      const matchItem = !itemId || t.item_id === itemId;
      const matchType = !type   || t.type === type;
      return matchItem && matchType;
    });

    const tbody = document.getElementById('historyTableBody');
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-10 text-gray-400">거래 내역이 없습니다.</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(t => {
      const badge = t.type === 'in'
        ? '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs font-medium">입고</span>'
        : '<span class="bg-orange-100 text-orange-700 px-2 py-0.5 rounded text-xs font-medium">출고</span>';
      return `<tr class="border-b border-gray-100 hover:bg-gray-50">
        <td class="px-4 py-3 font-medium text-gray-800">${t.item_name || ''}</td>
        <td class="px-4 py-3 text-center">${badge}</td>
        <td class="px-4 py-3 text-right font-semibold">${t.quantity ?? 0}</td>
        <td class="px-4 py-3 text-right text-gray-600">${t.stock_after ?? 0}</td>
        <td class="px-4 py-3 text-gray-500">${t.handler || '-'}</td>
        <td class="px-4 py-3 text-gray-400 text-xs">${t.note || ''}</td>
      </tr>`;
    }).join('');
  }

  // ── 수정 모달 ─────────────────────────────────────────────────────────────
  function openEditModal(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    document.getElementById('editId').value       = item.id;
    document.getElementById('editName').value     = item.name || '';
    document.getElementById('editCategory').value = item.category || '';
    document.getElementById('editUnit').value     = item.unit || '';
    document.getElementById('editStock').value    = item.stock ?? 0;
    document.getElementById('editMinStock').value = item.min_stock ?? 0;
    document.getElementById('editModal').classList.remove('hidden');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.add('hidden');
  }

  async function confirmEdit() {
    const id       = document.getElementById('editId').value;
    const name     = document.getElementById('editName').value.trim();
    const category = document.getElementById('editCategory').value.trim();
    const unit     = document.getElementById('editUnit').value.trim();
    const stock    = parseInt(document.getElementById('editStock').value) || 0;
    const minStock = parseInt(document.getElementById('editMinStock').value) || 0;

    const { error } = await db.from('items').update({ name, category, unit, stock, min_stock: minStock }).eq('id', id);
    if (error) { showToast('수정 오류: ' + error.message, 'error'); return; }
    showToast('수정 완료!', 'success');
    closeEditModal();
    loadItems();
  }

  // ── 삭제 모달 ─────────────────────────────────────────────────────────────
  function openDeleteModal(id, name) {
    deleteTargetId = id;
    document.getElementById('deleteItemName').textContent = name;
    document.getElementById('deleteModal').classList.remove('hidden');
  }

  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.add('hidden');
    deleteTargetId = null;
  }

  async function confirmDelete() {
    if (!deleteTargetId) return;
    const { error } = await db.from('items').delete().eq('id', deleteTargetId);
    if (error) { showToast('삭제 오류: ' + error.message, 'error'); return; }
    showToast('삭제 완료!', 'success');
    closeDeleteModal();
    loadItems();
  }

  // ── 토스트 ────────────────────────────────────────────────────────────────
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type + ' show';
    setTimeout(() => { t.classList.remove('show'); }, 3000);
  }
</script>
</body>
</html>
