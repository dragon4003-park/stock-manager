<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>실험실 소모품 관리 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .tab-btn { border-bottom: 2px solid transparent; color: #6b7280; }
    .tab-btn.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
             background: #1f2937; color: white; padding: 10px 20px; border-radius: 8px;
             font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- 헤더 -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-40">
  <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
      </div>
      <span class="font-bold text-gray-900 text-base">실험실 소모품 관리 시스템</span>
    </div>
  </div>
</header>

<!-- 탭 -->
<div class="bg-white border-b border-gray-200 sticky top-14 z-30">
  <div class="max-w-5xl mx-auto px-4 flex gap-1 overflow-x-auto">
    <button class="tab-btn active px-4 py-3 text-sm whitespace-nowrap" onclick="switchTab('inventory')">재고 현황</button>
    <button class="tab-btn px-4 py-3 text-sm whitespace-nowrap" onclick="switchTab('register')">소모품 등록</button>
    <button class="tab-btn px-4 py-3 text-sm whitespace-nowrap" onclick="switchTab('inout')">입출고</button>
    <button class="tab-btn px-4 py-3 text-sm whitespace-nowrap" onclick="switchTab('history')">거래 내역</button>
  </div>
</div>

<div class="max-w-5xl mx-auto px-4 py-4">

  <!-- 탭1: 재고 현황 -->
  <div id="tab-inventory">
    <!-- 검색/필터 -->
    <div class="flex flex-wrap gap-2 mb-4">
      <input id="searchInput" type="text" placeholder="품명 검색..."
        class="flex-1 min-w-[180px] border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        oninput="renderInventory()"/>
      <select id="categoryFilter"
        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        onchange="renderInventory()">
        <option value="">전체 분류</option>
      </select>
      <select id="statusFilter"
        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        onchange="renderInventory()">
        <option value="">전체 상태</option>
        <option value="normal">정상</option>
        <option value="low">재고 부족</option>
        <option value="out">재고 소진</option>
      </select>
      <button onclick="loadAll()"
        class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">
        새로고침
      </button>
    </div>

    <!-- 통계 카드 -->
    <div class="grid grid-cols-3 gap-3 mb-4">
      <div class="bg-white border border-gray-200 rounded-lg p-3">
        <div class="text-xs text-gray-500 mb-1">전체 품목</div>
        <div id="statTotal" class="text-2xl font-bold text-gray-900">-</div>
      </div>
      <div class="bg-white border border-yellow-300 rounded-lg p-3">
        <div class="text-xs text-gray-500 mb-1">재고 부족</div>
        <div id="statLow" class="text-2xl font-bold text-yellow-500">-</div>
      </div>
      <div class="bg-white border border-red-300 rounded-lg p-3">
        <div class="text-xs text-gray-500 mb-1">재고 소진</div>
        <div id="statOut" class="text-2xl font-bold text-red-500">-</div>
      </div>
    </div>

    <!-- 테이블 -->
    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-600">품명</th>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-600">분류</th>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-600">단위</th>
            <th class="text-right px-4 py-3 text-xs font-semibold text-gray-600">현재고</th>
            <th class="text-right px-4 py-3 text-xs font-semibold text-gray-600">최소재고</th>
            <th class="text-center px-4 py-3 text-xs font-semibold text-gray-600">상태</th>
            <th class="text-center px-4 py-3 text-xs font-semibold text-gray-600">관리</th>
          </tr>
        </thead>
        <tbody id="inventoryBody">
          <tr><td colspan="7" class="text-center py-8 text-gray-400 text-sm">데이터 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 탭2: 소모품 등록 -->
  <div id="tab-register" class="hidden">
    <div class="max-w-lg bg-white border border-gray-200 rounded-lg p-5">
      <h2 class="font-bold text-gray-900 mb-4">새 소모품 등록</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">품명 *</label>
          <input id="regName" type="text" placeholder="예: 96-웰 플레이트"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">분류 *</label>
          <input id="regCategory" type="text" placeholder="예: 플레이트 / 튜브"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">단위</label>
          <input id="regUnit" type="text" placeholder="예: 개, box, mL"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">초기 재고</label>
            <input id="regQty" type="number" min="0" value="0"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">최소 재고</label>
            <input id="regMinQty" type="number" min="0" value="0"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
          </div>
        </div>
        <button onclick="registerItem()"
          class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-blue-700 mt-2">
          등록하기
        </button>
      </div>
    </div>
  </div>

  <!-- 탭3: 입출고 -->
  <div id="tab-inout" class="hidden">
    <div class="max-w-lg bg-white border border-gray-200 rounded-lg p-5">
      <h2 class="font-bold text-gray-900 mb-4">입출고 처리</h2>
      <!-- 입고/출고 선택 -->
      <div class="flex gap-2 mb-4">
        <button id="btnIn"
          onclick="setTxType('in')"
          class="flex-1 py-2 rounded-lg text-sm font-medium border-2 border-blue-600 bg-blue-600 text-white">
          입고
        </button>
        <button id="btnOut"
          onclick="setTxType('out')"
          class="flex-1 py-2 rounded-lg text-sm font-medium border-2 border-gray-300 text-gray-600 bg-white">
          출고
        </button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">품목 선택 *</label>
          <select id="txItem"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- 품목 선택 --</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">수량 *</label>
          <input id="txQty" type="number" min="1" value="1"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">담당자</label>
          <input id="txHandler" type="text" placeholder="이름 입력"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">비고</label>
          <input id="txNote" type="text" placeholder="메모 (선택)"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <button onclick="submitTx()"
          class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-blue-700">
          처리하기
        </button>
      </div>
    </div>
  </div>

  <!-- 탭4: 거래 내역 -->
  <div id="tab-history" class="hidden">
    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-600">품명</th>
            <th class="text-center px-4 py-3 text-xs font-semibold text-gray-600">유형</th>
            <th class="text-right px-4 py-3 text-xs font-semibold text-gray-600">수량</th>
            <th class="text-right px-4 py-3 text-xs font-semibold text-gray-600">처리 후 재고</th>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-600">담당자</th>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-600">비고</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr><td colspan="6" class="text-center py-8 text-gray-400 text-sm">데이터 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- 삭제 확인 모달 -->
<div id="deleteModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl p-6 max-w-sm w-full">
    <h3 class="font-bold text-gray-900 mb-2">소모품 삭제</h3>
    <p class="text-sm text-gray-600 mb-4" id="deleteModalMsg">정말 삭제하시겠습니까?</p>
    <div class="flex gap-2">
      <button onclick="closeDeleteModal()"
        class="flex-1 border border-gray-300 text-gray-700 py-2 rounded-lg text-sm">취소</button>
      <button onclick="confirmDelete()"
        class="flex-1 bg-red-500 text-white py-2 rounded-lg text-sm font-medium">삭제</button>
    </div>
  </div>
</div>

<!-- 수정 모달 -->
<div id="editModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl p-6 max-w-sm w-full">
    <h3 class="font-bold text-gray-900 mb-4">소모품 수정</h3>
    <input id="editId" type="hidden"/>
    <div class="space-y-3">
      <div>
        <label class="block text-xs text-gray-600 mb-1">품명</label>
        <input id="editName" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div>
        <label class="block text-xs text-gray-600 mb-1">분류</label>
        <input id="editCategory" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-gray-600 mb-1">단위</label>
          <input id="editUnit" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">최소재고</label>
          <input id="editMinQty" type="number" min="0" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>
    </div>
    <div class="flex gap-2 mt-4">
      <button onclick="closeEditModal()" class="flex-1 border border-gray-300 text-gray-700 py-2 rounded-lg text-sm">취소</button>
      <button onclick="confirmEdit()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm font-medium">저장</button>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div id="toast" class="toast"></div>

<script>
  // ────── Supabase 초기화 ──────
  const SUPABASE_URL = 'https://hjtfrbwakcjpqcrztpij.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqdGZyYndha2NqcHFjcnp0cGlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NDYxNTUsImV4cCI6MjA5NTUyMjE1NX0.8d8bkHFYFV8BrR4kR-OHg3NiOTqBiXDPdeTM5q513RA';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let items = [];
  let transactions = [];
  let currentTxType = 'in';
  let deleteTargetId = null;

  // ────── 탭 전환 ──────
  function switchTab(tab) {
    ['inventory','register','inout','history'].forEach(t => {
      document.getElementById('tab-' + t).classList.add('hidden');
    });
    document.getElementById('tab-' + tab).classList.remove('hidden');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if (tab === 'history') renderHistory();
    if (tab === 'inout') renderItemSelect();
  }

  // ────── 데이터 로드 ──────
  async function loadAll() {
    await loadItems();
    loadTransactions();
  }

  async function loadItems() {
    const { data, error } = await sb
      .from('items')
      .select('*')
      .order('name', { ascending: true });
    if (error) {
      showToast('items 로드 실패: ' + error.message);
      document.getElementById('inventoryBody').innerHTML =
        '<tr><td colspan="7" class="text-center py-8 text-red-400 text-sm">데이터 로드 실패: ' + error.message + '</td></tr>';
      return;
    }
    items = data || [];
    renderInventory();
    syncCategoryFilter();
    updateStats();
  }

  async function loadTransactions() {
    const { data, error } = await sb
      .from('transactions')
      .select('*')
      .order('id', { ascending: false })
      .limit(200);
    if (error) {
      console.warn('transactions 로드 실패:', error.message);
      transactions = [];
      return;
    }
    transactions = data || [];
  }

  // ────── 통계 업데이트 ──────
  function updateStats() {
    document.getElementById('statTotal').textContent = items.length;
    document.getElementById('statLow').textContent =
      items.filter(i => i.quantity > 0 && i.quantity <= i.min_quantity).length;
    document.getElementById('statOut').textContent =
      items.filter(i => i.quantity === 0).length;
  }

  // ────── 카테고리 필터 동기화 ──────
  function syncCategoryFilter() {
    const sel = document.getElementById('categoryFilter');
    const cats = [...new Set(items.map(i => i.category).filter(Boolean))].sort();
    const cur = sel.value;
    sel.innerHTML = '<option value="">전체 분류</option>'
      + cats.map(c => `<option value="${c}"${c===cur?' selected':''}>${c}</option>`).join('');
  }

  // ────── 재고 현황 렌더 ──────
  function renderInventory() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const cat    = document.getElementById('categoryFilter').value;
    const status = document.getElementById('statusFilter').value;

    let filtered = items.filter(i => {
      if (search && !(i.name||'').toLowerCase().includes(search)) return false;
      if (cat && i.category !== cat) return false;
      if (status === 'normal' && !(i.quantity > i.min_quantity)) return false;
      if (status === 'low'    && !(i.quantity > 0 && i.quantity <= i.min_quantity)) return false;
      if (status === 'out'    && i.quantity !== 0) return false;
      return true;
    });

    const tbody = document.getElementById('inventoryBody');
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-gray-400 text-sm">등록된 소모품이 없습니다.</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(i => {
      let badge, color;
      if (i.quantity === 0) {
        badge = '재고 소진'; color = 'bg-red-100 text-red-700';
      } else if (i.quantity <= i.min_quantity) {
        badge = '재고 부족'; color = 'bg-yellow-100 text-yellow-700';
      } else {
        badge = '정상'; color = 'bg-green-100 text-green-700';
      }
      return `<tr class="border-b border-gray-100 hover:bg-gray-50">
        <td class="px-4 py-3 font-medium text-gray-900">${i.name||''}</td>
        <td class="px-4 py-3 text-gray-600">${i.category||''}</td>
        <td class="px-4 py-3 text-gray-600">${i.unit||''}</td>
        <td class="px-4 py-3 text-right font-semibold ${i.quantity===0?'text-red-500':i.quantity<=i.min_quantity?'text-yellow-600':'text-gray-900'}">${i.quantity??0}</td>
        <td class="px-4 py-3 text-right text-gray-500">${i.min_quantity??0}</td>
        <td class="px-4 py-3 text-center">
          <span class="px-2 py-0.5 rounded text-xs font-medium ${color}">${badge}</span>
        </td>
        <td class="px-4 py-3 text-center">
          <div class="flex gap-1 justify-center">
            <button onclick="openEditModal('${i.id}')"
              class="px-2 py-1 text-xs text-blue-600 border border-blue-300 rounded hover:bg-blue-50">수정</button>
            <button onclick="openDeleteModal('${i.id}','${(i.name||'').replace(/'/g,"\'")}' )"
              class="px-2 py-1 text-xs text-red-500 border border-red-200 rounded hover:bg-red-50">삭제</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  // ────── 소모품 등록 ──────
  async function registerItem() {
    const name     = document.getElementById('regName').value.trim();
    const category = document.getElementById('regCategory').value.trim();
    const unit     = document.getElementById('regUnit').value.trim();
    const qty      = parseInt(document.getElementById('regQty').value) || 0;
    const minQty   = parseInt(document.getElementById('regMinQty').value) || 0;
    if (!name) { showToast('품명을 입력해주세요.'); return; }
    if (!category) { showToast('분류를 입력해주세요.'); return; }

    const { error } = await sb.from('items').insert([{
      name, category, unit, quantity: qty, min_quantity: minQty
    }]);
    if (error) { showToast('등록 실패: ' + error.message); return; }
    showToast(name + ' 등록 완료!');
    ['regName','regCategory','regUnit'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('regQty').value = '0';
    document.getElementById('regMinQty').value = '0';
    await loadItems();
  }

  // ────── 입출고 ──────
  function setTxType(type) {
    currentTxType = type;
    document.getElementById('btnIn').className  = type === 'in'
      ? 'flex-1 py-2 rounded-lg text-sm font-medium border-2 border-blue-600 bg-blue-600 text-white'
      : 'flex-1 py-2 rounded-lg text-sm font-medium border-2 border-gray-300 text-gray-600 bg-white';
    document.getElementById('btnOut').className = type === 'out'
      ? 'flex-1 py-2 rounded-lg text-sm font-medium border-2 border-red-500 bg-red-500 text-white'
      : 'flex-1 py-2 rounded-lg text-sm font-medium border-2 border-gray-300 text-gray-600 bg-white';
  }

  function renderItemSelect() {
    const sel = document.getElementById('txItem');
    sel.innerHTML = '<option value="">-- 품목 선택 --</option>'
      + items.map(i => `<option value="${i.id}">[${i.category||''}] ${i.name} (현재고: ${i.quantity??0})</option>`).join('');
  }

  async function submitTx() {
    const itemId  = document.getElementById('txItem').value;
    const qty     = parseInt(document.getElementById('txQty').value) || 0;
    const handler = document.getElementById('txHandler').value.trim();
    const note    = document.getElementById('txNote').value.trim();
    if (!itemId) { showToast('품목을 선택해주세요.'); return; }
    if (qty <= 0) { showToast('수량은 1 이상이어야 합니다.'); return; }

    const item = items.find(i => i.id === itemId);
    if (!item) { showToast('품목 정보를 찾을 수 없습니다.'); return; }

    let newQty;
    if (currentTxType === 'in') {
      newQty = (item.quantity || 0) + qty;
    } else {
      if ((item.quantity || 0) < qty) {
        showToast('재고 부족! 현재 재고: ' + (item.quantity||0)); return;
      }
      newQty = (item.quantity || 0) - qty;
    }

    const { error: txErr } = await sb.from('transactions').insert([{
      item_id: itemId,
      item_name: item.name,
      type: currentTxType,
      quantity: qty,
      stock_after: newQty,
      handler: handler || null,
      note: note || null
    }]);
    if (txErr) { showToast('거래 기록 실패: ' + txErr.message); return; }

    const { error: upErr } = await sb.from('items').update({ quantity: newQty }).eq('id', itemId);
    if (upErr) { showToast('재고 업데이트 실패: ' + upErr.message); return; }

    showToast((currentTxType === 'in' ? '입고' : '출고') + ' 처리 완료! (' + item.name + ' ' + qty + ')');
    document.getElementById('txItem').value = '';
    document.getElementById('txQty').value = '1';
    document.getElementById('txHandler').value = '';
    document.getElementById('txNote').value = '';
    await loadAll();
    renderItemSelect();
  }

  // ────── 거래 내역 ──────
  function renderHistory() {
    const tbody = document.getElementById('historyBody');
    if (transactions.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-400 text-sm">거래 내역이 없습니다.</td></tr>';
      return;
    }
    tbody.innerHTML = transactions.map(t => {
      const isIn = t.type === 'in';
      return `<tr class="border-b border-gray-100 hover:bg-gray-50">
        <td class="px-4 py-3 font-medium text-gray-900">${t.item_name||''}</td>
        <td class="px-4 py-3 text-center">
          <span class="px-2 py-0.5 rounded text-xs font-medium ${isIn?'bg-blue-100 text-blue-700':'bg-orange-100 text-orange-700'}">
            ${isIn?'입고':'출고'}
          </span>
        </td>
        <td class="px-4 py-3 text-right ${isIn?'text-blue-600':'text-orange-600'} font-semibold">
          ${isIn?'+':'-'}${t.quantity||0}
        </td>
        <td class="px-4 py-3 text-right text-gray-600">${t.stock_after??'-'}</td>
        <td class="px-4 py-3 text-gray-600">${t.handler||'-'}</td>
        <td class="px-4 py-3 text-gray-500 text-xs">${t.note||''}</td>
      </tr>`;
    }).join('');
  }

  // ────── 수정 모달 ──────
  function openEditModal(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    document.getElementById('editId').value = id;
    document.getElementById('editName').value = item.name || '';
    document.getElementById('editCategory').value = item.category || '';
    document.getElementById('editUnit').value = item.unit || '';
    document.getElementById('editMinQty').value = item.min_quantity ?? 0;
    document.getElementById('editModal').classList.remove('hidden');
  }
  function closeEditModal() {
    document.getElementById('editModal').classList.add('hidden');
  }
  async function confirmEdit() {
    const id      = document.getElementById('editId').value;
    const name    = document.getElementById('editName').value.trim();
    const cat     = document.getElementById('editCategory').value.trim();
    const unit    = document.getElementById('editUnit').value.trim();
    const minQty  = parseInt(document.getElementById('editMinQty').value) || 0;
    if (!name) { showToast('품명을 입력해주세요.'); return; }

    const { error } = await sb.from('items')
      .update({ name, category: cat, unit, min_quantity: minQty })
      .eq('id', id);
    if (error) { showToast('수정 실패: ' + error.message); return; }
    showToast('수정 완료!');
    closeEditModal();
    await loadItems();
  }

  // ────── 삭제 모달 ──────
  function openDeleteModal(id, name) {
    deleteTargetId = id;
    document.getElementById('deleteModalMsg').textContent = '"' + name + '" 을(를) 삭제하시겠습니까?';
    document.getElementById('deleteModal').classList.remove('hidden');
  }
  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.add('hidden');
    deleteTargetId = null;
  }
  async function confirmDelete() {
    if (!deleteTargetId) return;
    const { error } = await sb.from('items').delete().eq('id', deleteTargetId);
    if (error) { showToast('삭제 실패: ' + error.message); return; }
    showToast('삭제 완료!');
    closeDeleteModal();
    await loadItems();
  }

  // ────── 토스트 ──────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ────── 앱 시작 ──────
  loadAll();
</script>
</body>
</html>
