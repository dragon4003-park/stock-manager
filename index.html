<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실험실 소모품 관리 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .badge-normal  { background:#dcfce7; color:#166534; }
    .badge-low     { background:#fef9c3; color:#854d0e; }
    .badge-empty   { background:#fee2e2; color:#991b1b; }
    .dup-warning   { background:#fff7ed; border:1px solid #fb923c; border-radius:6px; padding:8px 12px; }
    .tab-active    { border-bottom:2px solid #2563eb !important; color:#2563eb !important; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow p-8 w-full max-w-sm">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center shrink-0">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-base font-bold text-gray-900">실험실 소모품 관리 시스템</h1>
        <p class="text-xs text-gray-400">Laboratory Consumable Manager</p>
      </div>
    </div>
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">이메일</label>
        <input id="loginEmail" type="email" placeholder="이메일 입력"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
               onkeydown="if(event.key==='Enter') login()">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">비밀번호</label>
        <input id="loginPw" type="password" placeholder="비밀번호 입력"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
               onkeydown="if(event.key==='Enter') login()">
      </div>
      <div id="loginError" class="hidden text-xs text-red-600 bg-red-50 rounded p-2"></div>
      <button onclick="login()"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg py-2 text-sm transition">
        로그인
      </button>
    </div>
  </div>
</div>

<div id="mainApp" class="hidden">

  <header class="bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center shrink-0">
          <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
          </svg>
        </div>
        <span class="text-sm font-bold text-gray-900">실험실 소모품 관리 시스템</span>
      </div>
      <div class="flex items-center gap-2">
        <span id="userEmail" class="text-xs text-gray-400 hidden sm:block"></span>
        <button onclick="openPwModal()"
                class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg text-gray-700 transition">
          비밀번호 변경
        </button>
        <button onclick="logout()"
                class="text-xs bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg text-red-600 transition">
          로그아웃
        </button>
      </div>
    </div>
  </header>

  <div class="bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto flex overflow-x-auto">
      <button id="tab-stock"    onclick="showTab('stock')"
              class="tab-btn shrink-0 px-5 py-3 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition">
        재고 현황
      </button>
      <button id="tab-register" onclick="showTab('register')"
              class="tab-btn shrink-0 px-5 py-3 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition">
        소모품 등록
      </button>
      <button id="tab-inout"    onclick="showTab('inout')"
              class="tab-btn shrink-0 px-5 py-3 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition">
        입출고
      </button>
      <button id="tab-history"  onclick="showTab('history')"
              class="tab-btn shrink-0 px-5 py-3 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition">
        거래 내역
      </button>
    </div>
  </div>

  <div class="max-w-5xl mx-auto p-4">

    <div id="content-stock" class="tab-content">
      <div class="flex flex-wrap gap-2 mb-4">
        <input id="stockSearch" type="text" placeholder="품명 검색..."
               oninput="renderStock()"
               class="border border-gray-300 rounded-lg px-3 py-2 text-sm flex-1 min-w-32 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <select id="stockCatFilter" onchange="renderStock()"
                class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">전체 분류</option>
          <option>주사기 / 바늘</option>
          <option>장갑</option>
          <option>TLC 관련</option>
          <option>필터 / 막</option>
          <option>바이알 / 튜브</option>
          <option>피펫 / 팁</option>
          <option>보호구</option>
          <option>기타</option>
        </select>
        <select id="stockStatusFilter" onchange="renderStock()"
                class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">전체 상태</option>
          <option value="low">부족 / 소진만</option>
        </select>
        <button onclick="loadAll()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm transition">
          새로고침
        </button>
      </div>
      <div class="grid grid-cols-3 gap-3 mb-4" id="stockSummary"></div>
      <div class="bg-white rounded-xl border border-gray-200 overflow-x-auto">
        <table class="w-full text-sm min-w-max">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-4 py-3 font-medium text-gray-600">품명</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600">분류</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600">단위</th>
              <th class="text-right px-4 py-3 font-medium text-gray-600">현재고</th>
              <th class="text-right px-4 py-3 font-medium text-gray-600">최소재고</th>
              <th class="text-center px-4 py-3 font-medium text-gray-600">상태</th>
              <th class="text-center px-4 py-3 font-medium text-gray-600">관리</th>
            </tr>
          </thead>
          <tbody id="stockTableBody">
            <tr><td colspan="7" class="text-center py-10 text-gray-400">데이터 불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="content-register" class="tab-content hidden">
      <div class="max-w-lg mx-auto bg-white rounded-xl border border-gray-200 p-6">
        <h2 class="text-base font-bold text-gray-900 mb-1">새 소모품 등록</h2>
        <p class="text-xs text-gray-400 mb-5">실험실 소모품의 기본 정보와 초기 재고를 설정합니다.</p>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">품명 <span class="text-red-500">*</span></label>
            <input id="regName" type="text" placeholder="예: TLC 플레이트 (Silica, 10x10 cm)"
                   oninput="onRegNameInput()"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div id="dupWarning" class="hidden mt-2 dup-warning">
              <p class="text-xs font-semibold text-orange-700">유사한 품명이 이미 등록되어 있어요!</p>
              <p id="dupItemText" class="text-xs text-orange-600 mt-0.5"></p>
              <p class="text-xs text-orange-500 mt-1">띄어쓰기만 다른 동일 품목인지 확인해주세요.</p>
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">분류</label>
            <div class="flex gap-2">
              <select id="regCategory"
                      class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option>주사기 / 바늘</option>
                <option>장갑</option>
                <option>TLC 관련</option>
                <option>필터 / 막</option>
                <option>바이알 / 튜브</option>
                <option>피펫 / 팁</option>
                <option>보호구</option>
                <option>기타</option>
              </select>
              <button id="customCatBtn" onclick="toggleCustomCat()"
                      class="shrink-0 text-xs border border-gray-300 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 transition">
                직접 입력
              </button>
            </div>
            <input id="regCategoryCustom" type="text" placeholder="분류명 직접 입력"
                   class="hidden w-full mt-2 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">단위</label>
            <div class="flex gap-2">
              <select id="regUnit"
                      class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option>개</option>
                <option>박스</option>
                <option>팩</option>
                <option>장</option>
                <option>롤</option>
                <option>병</option>
                <option>통</option>
                <option>세트</option>
              </select>
              <input id="regUnitCustom" type="text" placeholder="단위 직접 입력 (선택)"
                     class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">초기 재고</label>
              <input id="regStock" type="number" value="0" min="0"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">최소 재고 (부족 알림 기준)</label>
              <input id="regMinStock" type="number" value="5" min="0"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">비고</label>
            <input id="regNote" type="text" placeholder="규격, 제조사, 제품번호 등 (선택)"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div id="regError"   class="hidden text-xs text-red-600  bg-red-50  rounded p-2"></div>
          <div id="regSuccess" class="hidden text-xs text-green-700 bg-green-50 rounded p-2"></div>
          <button onclick="registerItem()"
                  class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg py-2 text-sm transition">
            등록하기
          </button>
        </div>
      </div>
    </div>

    <div id="content-inout" class="tab-content hidden">
      <div class="max-w-lg mx-auto bg-white rounded-xl border border-gray-200 p-6">
        <h2 class="text-base font-bold text-gray-900 mb-5">입출고 등록</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">유형</label>
            <div class="flex gap-2">
              <button id="typeInBtn"  onclick="setType('in')"
                      class="flex-1 py-2 rounded-lg text-sm font-medium border-2 border-blue-600 bg-blue-600 text-white transition">
                입고
              </button>
              <button id="typeOutBtn" onclick="setType('out')"
                      class="flex-1 py-2 rounded-lg text-sm font-medium border-2 border-gray-300 text-gray-600 hover:border-gray-400 transition">
                출고
              </button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">품목 <span class="text-red-500">*</span></label>
            <input id="inoutSearch" type="text" placeholder="품명 검색..."
                   oninput="filterInoutItems()"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 mb-1">
            <select id="inoutItem" size="5" onchange="updateCurrentStock()"
                    class="w-full border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </select>
            <p class="text-xs text-gray-500 mt-1">현재고: <span id="currentStockDisplay" class="font-semibold text-gray-800">-</span></p>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">수량 <span class="text-red-500">*</span></label>
            <input id="inoutQty" type="number" value="1" min="1"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">담당자</label>
            <input id="inoutHandler" type="text" placeholder="담당자 이름 (선택)"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">비고</label>
            <input id="inoutNote" type="text" placeholder="비고 (선택)"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div id="inoutError"   class="hidden text-xs text-red-600  bg-red-50  rounded p-2"></div>
          <div id="inoutSuccess" class="hidden text-xs text-green-700 bg-green-50 rounded p-2"></div>
          <button onclick="submitInout()"
                  class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg py-2 text-sm transition">
            등록하기
          </button>
        </div>
      </div>
    </div>

    <div id="content-history" class="tab-content hidden">
      <div class="flex flex-wrap gap-2 mb-4">
        <input id="histSearch" type="text" placeholder="품명 검색..."
               oninput="renderHistory()"
               class="border border-gray-300 rounded-lg px-3 py-2 text-sm flex-1 min-w-32 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <select id="histTypeFilter" onchange="renderHistory()"
                class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">전체 유형</option>
          <option value="in">입고</option>
          <option value="out">출고</option>
        </select>
        <button onclick="loadAll()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm transition">
          새로고침
        </button>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 overflow-x-auto">
        <table class="w-full text-sm min-w-max">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-4 py-3 font-medium text-gray-600">일시</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600">품명</th>
              <th class="text-center px-4 py-3 font-medium text-gray-600">유형</th>
              <th class="text-right px-4 py-3 font-medium text-gray-600">수량</th>
              <th class="text-right px-4 py-3 font-medium text-gray-600">처리 후 재고</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600">담당자</th>
              <th class="text-left px-4 py-3 font-medium text-gray-600">비고</th>
            </tr>
          </thead>
          <tbody id="histTableBody">
            <tr><td colspan="7" class="text-center py-10 text-gray-400">데이터 불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<div id="pwModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm">
    <h3 class="text-base font-bold text-gray-900 mb-4">비밀번호 변경</h3>
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">새 비밀번호 (6자리 이상)</label>
        <input id="newPw" type="password" placeholder="새 비밀번호"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">새 비밀번호 확인</label>
        <input id="newPwConfirm" type="password" placeholder="비밀번호 재입력"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div id="pwError"   class="hidden text-xs text-red-600  bg-red-50  rounded p-2"></div>
      <div id="pwSuccess" class="hidden text-xs text-green-700 bg-green-50 rounded p-2"></div>
      <div class="flex gap-2 pt-1">
        <button onclick="closePwModal()"
                class="flex-1 border border-gray-300 text-gray-700 py-2 rounded-lg text-sm hover:bg-gray-50 transition">
          취소
        </button>
        <button onclick="changePassword()"
                class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm transition">
          변경하기
        </button>
      </div>
    </div>
  </div>
</div>

<div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm">
    <h3 class="text-base font-bold text-gray-900 mb-2">소모품 삭제</h3>
    <p id="deleteItemLabel" class="text-sm text-gray-600 mb-2"></p>
    <p class="text-xs text-red-500 bg-red-50 rounded p-2 mb-4">삭제하면 해당 품목의 거래 내역도 모두 삭제됩니다.</p>
    <div class="flex gap-2">
      <button onclick="closeDeleteModal()"
              class="flex-1 border border-gray-300 text-gray-700 py-2 rounded-lg text-sm hover:bg-gray-50 transition">
        취소
      </button>
      <button onclick="confirmDelete()"
              class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg text-sm transition">
        삭제
      </button>
    </div>
  </div>
</div>

<script>
/* ── Supabase 초기화 ── */
const SUPABASE_URL = 'https://hjtfrbwakcjpqcrztpij.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MprppdoI1yJmFQcoSCvF9g_Q76n5xH2';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ── 전역 상태 ── */
var items          = [];
var transactions   = [];
var currentType    = 'in';
var deleteTargetId = null;
var isCustomCat    = false;

/* ── 화면 전환 헬퍼 ── */
function showLogin() {
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPw').value    = '';
  document.getElementById('loginError').classList.add('hidden');
}

function showApp(email) {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('userEmail').textContent = email || '';
}

/* ── 인증 ── */
async function login() {
  var email = document.getElementById('loginEmail').value.trim();
  var pw    = document.getElementById('loginPw').value;
  var errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');

  if (!email || !pw) {
    errEl.textContent = '이메일과 비밀번호를 입력해주세요.';
    errEl.classList.remove('hidden');
    return;
  }

  var result = await sb.auth.signInWithPassword({ email: email, password: pw });
  if (result.error) {
    errEl.textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
    errEl.classList.remove('hidden');
  }
}

async function logout() {
  try {
    await sb.auth.signOut();
  } catch(e) {
    console.log('signOut error:', e);
  }
  /* 응답 여부와 관계없이 무조건 로그인 화면으로 전환 */
  items        = [];
  transactions = [];
  showLogin();
}
