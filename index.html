<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>실험실 소모품 관리 시스템</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: 'Pretendard', -apple-system, sans-serif; }
  .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  .status-normal { background: #dcfce7; color: #166534; }
  .status-low    { background: #fef9c3; color: #854d0e; }
  .status-out    { background: #fee2e2; color: #991b1b; }
  .badge-in      { background: #dbeafe; color: #1d4ed8; }
  .badge-out     { background: #fce7f3; color: #9d174d; }
  @keyframes pulse-bg { 0%,100%{opacity:1}50%{opacity:.5} }
  .row-critical  { animation: pulse-bg 1.5s infinite; background:#fee2e2; }
  .row-warning   { background:#fef9c3; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- ===================== SUPABASE 설정 (이 두 줄만 수정!) ===================== -->
<script>
  const SUPABASE_URL  = 'YOUR_SUPABASE_URL';   // 본인 Supabase URL 입력
  const SUPABASE_KEY  = 'YOUR_SUPABASE_ANON_KEY'; // 본인 Supabase anon key 입력
</script>

<!-- ===================== 로그인 화면 ===================== -->
<div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.022.547l-.048.048a2 2 0 00.547 3.35l1.497.748a6 6 0 005.412 0l1.497-.748a2 2 0 00.547-3.35l-.048-.048z"/>
        </svg>
      </div>
      <div>
        <div class="font-bold text-gray-900">실험실 소모품 관리</div>
        <div class="text-xs text-gray-400">Laboratory Consumable Manager</div>
      </div>
    </div>
    <div class="space-y-4">
      <div>
        <label class="text-sm text-gray-600 block mb-1">이메일</label>
        <input id="loginEmail" type="email" placeholder="이메일 입력"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div>
        <label class="text-sm text-gray-600 block mb-1">비밀번호</label>
        <input id="loginPassword" type="password" placeholder="비밀번호 입력"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
               onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <div id="loginError" class="text-red-500 text-xs hidden"></div>
      <button onclick="doLogin()"
              class="w-full bg-blue-600 text-white rounded-lg py-2 text-sm font-medium hover:bg-blue-700 transition">
        로그인
      </button>
      <button onclick="showSignup()"
              class="w-full border border-gray-200 text-gray-600 rounded-lg py-2 text-sm hover:bg-gray-50 transition">
        회원가입
      </button>
    </div>
  </div>
</div>

<!-- ===================== 회원가입 화면 ===================== -->
<div id="signupPage" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm">
    <h2 class="font-bold text-gray-900 text-lg mb-6">회원가입</h2>
    <div class="space-y-4">
      <div>
        <label class="text-sm text-gray-600 block mb-1">이메일</label>
        <input id="signupEmail" type="email" placeholder="이메일 입력"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div>
        <label class="text-sm text-gray-600 block mb-1">비밀번호</label>
        <input id="signupPassword" type="password" placeholder="비밀번호 6자 이상"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>
      <div id="signupError" class="text-red-500 text-xs hidden"></div>
      <button onclick="doSignup()"

        가입하기
      </button>
      <button onclick="showLogin()"
              class="w-full border border-gray-200 text-gray-600 rounded-lg py-2 text-sm hover:bg-gray-50 transition">

    </div>

</div>

<!-- ===================== 메인 앱 ===================== -->
<div id="appPage" class="hidden">

          </svg>

      </div>
      <div class="flex items-center gap-2">
        <span id="headerEmail" class="text-xs text-gray-400 hidden sm:block"></span>
        <button onclick="showChangePw()"

        <button onclick="doLogout()"

        <button onclick="closeModal('changePwModal')"

<!-- ===================== 삭제 확인 모달 ===================== -->
<div id="deleteModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">

    <h3 class="font-semibold text-gray-900 mb-2">소모품 삭제</h3>
    <p class="text-sm text-gray-500 mb-4"><span id="deleteItemName" class="font-medium text-gray-900"></span>을(를) 삭제하시겠습니까? 거래 내역도 함께 삭제됩니다.</p>
    <div class="flex gap-2">
      <button onclick="doDelete()"
              class="flex-1 bg-red-500 text-white rounded-lg py-2 text-sm hover:bg-red-600">삭제</button>
      <button onclick="closeModal('deleteModal')"
              class="flex-1 border border-gray-200 rounded-lg py-2 text-sm hover:bg-gray-50">취소</button>
    </div>
  </div>
</div>

<!-- ===================== 토스트 ===================== -->
<div id="toast" class="hidden fixed bottom-4 right-4 bg-gray-900 text-white text-sm px-4 py-2 rounded-xl z-50 shadow-lg"></div>

<!-- ===================== JS ===================== -->
<script>
/* ─── Supabase 초기화 ─── */
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ─── 상태 ─── */
let items = [];
let transactions = [];
let currentUser = null;
let txType = 'in';
let selectedItemId = null;
let pendingDeleteId = null;

/* ─── 초기화 ─── */
window.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUser = session.user;
    await showApp();
  } else {
    showLogin();
  }
  sb.auth.onAuthStateChange(async (_e, session) => {
    if (session) { currentUser = session.user; await showApp(); }
    else         { showLogin(); }
  });
});

/* ─── 화면 전환 ─── */
function showLogin()  { hide('signupPage'); hide('appPage'); show('loginPage'); }
function showSignup() { hide('loginPage');  hide('appPage'); show('signupPage'); }
async function showApp() {
  hide('loginPage'); hide('signupPage'); show('appPage');
  document.getElementById('headerEmail').textContent = currentUser?.email || '';
  await loadAll();
}

/* ─── 인증 ─── */
async function doLogin() {
  const email    = v('loginEmail');
  const password = v('loginPassword');
  const el = document.getElementById('loginError');
  el.classList.add('hidden');
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { el.textContent = error.message; el.classList.remove('hidden'); }
}

async function doSignup() {
  const email    = v('signupEmail');
  const password = v('signupPassword');
  const el = document.getElementById('signupError');
  el.classList.add('hidden');
  const { error } = await sb.auth.signUp({ email, password });
  if (error) { el.textContent = error.message; el.classList.remove('hidden'); }
  else { showToast('가입 완료! 이메일 인증 후 로그인해주세요.'); showLogin(); }
}

async function doLogout() {
  try { await sb.auth.signOut(); } catch(e) {}
  items = []; transactions = []; currentUser = null;
  showLogin();
}

async function doChangePw() {
  const pw = v('newPw');
  const el = document.getElementById('pwError');
  el.classList.add('hidden');
  if (pw.length < 6) { el.textContent = '6자 이상 입력해주세요.'; el.classList.remove('hidden'); return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { el.textContent = error.message; el.classList.remove('hidden'); }
  else { closeModal('changePwModal'); showToast('비밀번호가 변경되었습니다.'); }
}

/* ─── 데이터 로드 (독립적으로 처리!) ─── */
async function loadAll() {
  await loadItems();          // items 먼저
  await loadTransactions();   // transactions 별도 (실패해도 items 영향 없음)
}

async function loadItems() {
  const { data, error } = await sb
    .from('items')
    .select('*')
    .order('name', { ascending: true });

  if (error) {
    console.error('items 로드 오류:', error);
    showToast('재고 데이터 로드 실패: ' + error.message);
    return;
  }
  items = data || [];
  renderInventory();
  syncCategoryFilter();
  syncRegisterCatSelect();
}

async function loadTransactions() {
  // ★ 핵심 수정: date/created_at 대신 id로 정렬 (컬럼 불일치 400 오류 해결)
  const { data, error } = await sb
    .from('transactions')
    .select('*')
    .order('id', { ascending: false })
    .limit(300);

  if (error) {
    console.error('transactions 로드 오류:', error);
    // 오류가 나도 토스트만 띄우고 앱은 계속 작동
    showToast('거래내역 로드 실패 (재고 현황은 정상)');
    transactions = [];
  } else {
    transactions = data || [];
  }
  renderHistory();
}

/* ─── 재고 현황 렌더링 ─── */
function renderInventory() {
  const q   = v('searchInput').toLowerCase();
  const cat = v('catFilter');
  const st  = v('statusFilter');

  const filtered = items.filter(item => {
    const matchQ   = item.name?.toLowerCase().includes(q) || !q;
    const matchCat = item.category === cat || !cat;
    const matchSt  = !st || getStatus(item) === st;
    return matchQ && matchCat && matchSt;
  });

  document.getElementById('kpiTotal').textContent = items.length;
  document.getElementById('kpiLow').textContent   = items.filter(i => getStatus(i) === 'low').length;
  document.getElementById('kpiOut').textContent   = items.filter(i => getStatus(i) === 'out').length;

  const tbody = document.getElementById('inventoryBody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-gray-400">품목이 없습니다.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(item => {
    const st = getStatus(item);
    const rowCls = st === 'out' ? 'row-critical' : st === 'low' ? 'row-warning' : '';
    const badge  = st === 'out'    ? '<span class="status-out px-2 py-0.5 rounded text-xs">소진</span>'
                 : st === 'low'    ? '<span class="status-low px-2 py-0.5 rounded text-xs">부족</span>'
                 : '<span class="status-normal px-2 py-0.5 rounded text-xs">정상</span>';
    return `<tr class="${rowCls} border-t border-gray-100">
      <td class="px-4 py-3 font-medium text-gray-900">${esc(item.name)}</td>
      <td class="px-4 py-3 text-gray-500">${esc(item.category||'')}</td>
      <td class="px-4 py-3 text-gray-500">${esc(item.unit||'')}</td>
      <td class="px-4 py-3 text-right font-semibold">${item.current_stock ?? item.currentStock ?? 0}</td>
      <td class="px-4 py-3 text-right text-gray-500">${item.min_stock ?? item.minStock ?? 0}</td>
      <td class="px-4 py-3 text-center">${badge}</td>
      <td class="px-4 py-3 text-center">
        <button onclick="confirmDelete('${item.id}','${esc(item.name)}')"
                class="text-xs text-red-500 hover:text-red-700 border border-red-200 rounded px-2 py-0.5">삭제</button>
      </td>
    </tr>`;
  }).join('');
}

function getStatus(item) {
  const cur = item.current_stock ?? item.currentStock ?? 0;
  const min = item.min_stock ?? item.minStock ?? 0;
  if (cur <= 0)       return 'out';
  if (cur < min)      return 'low';
  return 'normal';
}

function syncCategoryFilter() {
  const cats = [...new Set(items.map(i => i.category).filter(Boolean))].sort();
  const sel  = document.getElementById('catFilter');
  const cur  = sel.value;
  sel.innerHTML = '<option value="">전체 분류</option>'
    + cats.map(c => `<option value="${c}"${c===cur?' selected':''}>${esc(c)}</option>`).join('');
}

/* ─── 소모품 등록 ─── */
function syncRegisterCatSelect() {
  const cats = [...new Set(items.map(i => i.category).filter(Boolean))].sort();
  const sel  = document.getElementById('regCatSel');
  sel.innerHTML = '<option value="">-- 분류 선택 --</option>'
    + cats.map(c => `<option value="${c}">${esc(c)}</option>`).join('')
    + '<option value="__custom__">직접 입력...</option>';
}

function onCatSelChange() {
  const sel   = document.getElementById('regCatSel');
  const input = document.getElementById('regCatInput');
  if (sel.value === '__custom__') { input.classList.remove('hidden'); input.focus(); }
  else                            { input.classList.add('hidden'); }
}

async function doRegister() {
  const name  = v('regName').trim();
  const unit  = v('regUnit').trim();
  const stock = parseInt(v('regStock')) || 0;
  const min   = parseInt(v('regMin'))   || 0;
  const note  = v('regNote').trim();
  const el    = document.getElementById('regError');

  const catSel = document.getElementById('regCatSel');
  const cat    = catSel.value === '__custom__'
    ? v('regCatInput').trim()
    : catSel.value;

  el.classList.add('hidden');
  if (!name) { el.textContent = '품명을 입력해주세요.'; el.classList.remove('hidden'); return; }

  const { error } = await sb.from('items').insert({
    name, category: cat, unit,
    current_stock: stock, min_stock: min, note
  });

  if (error) { el.textContent = error.message; el.classList.remove('hidden'); return; }

  showToast(`${name} 등록 완료!`);
  ['regName','regUnit','regStock','regMin','regNote'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('regCatSel').value = '';
  document.getElementById('regCatInput').classList.add('hidden');
  await loadItems();
}

/* ─── 입출고 ─── */
function setTxType(type) {
  txType = type;
  const bIn  = document.getElementById('btnIn');
  const bOut = document.getElementById('btnOut');
  if (type === 'in') {
    bIn.className  = 'flex-1 py-2 rounded-lg text-sm font-medium border-2 border-blue-500 bg-blue-50 text-blue-700';
    bOut.className = 'flex-1 py-2 rounded-lg text-sm font-medium border-2 border-gray-200 text-gray-500';
  } else {
    bOut.className = 'flex-1 py-2 rounded-lg text-sm font-medium border-2 border-pink-500 bg-pink-50 text-pink-700';
    bIn.className  = 'flex-1 py-2 rounded-lg text-sm font-medium border-2 border-gray-200 text-gray-500';
  }
}

function renderTxDropdown() {
  const q   = v('txSearch').toLowerCase();
  const box = document.getElementById('txDropdown');
  const res = items.filter(i => i.name?.toLowerCase().includes(q)).slice(0, 20);
  if (res.length === 0 || !q) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  box.innerHTML = res.map(i => `
    <div onclick="selectTxItem('${i.id}')"
         class="px-3 py-2 hover:bg-blue-50 cursor-pointer text-sm border-b border-gray-100 last:border-0">
      <span class="font-medium">${esc(i.name)}</span>
      <span class="text-gray-400 text-xs ml-2">${esc(i.category||'')} · 현재고 ${i.current_stock ?? i.currentStock ?? 0}${esc(i.unit||'')}</span>
    </div>`).join('');
}

function selectTxItem(id) {
  selectedItemId = id;
  const item = items.find(i => i.id === id);
  if (!item) return;
  document.getElementById('txSearch').value = item.name;
  document.getElementById('txDropdown').classList.add('hidden');
  document.getElementById('txPreviewStock').textContent = `${item.current_stock ?? item.currentStock ?? 0} ${item.unit||''}`;
  document.getElementById('txPreviewMin').textContent   = `${item.min_stock ?? item.minStock ?? 0} ${item.unit||''}`;
  document.getElementById('txPreview').classList.remove('hidden');
}

async function doTransaction() {
  const el  = document.getElementById('txError');
  el.classList.add('hidden');
  if (!selectedItemId) { el.textContent = '품목을 선택해주세요.'; el.classList.remove('hidden'); return; }
  const qty = parseInt(v('txQty')) || 0;
  if (qty <= 0) { el.textContent = '수량을 입력해주세요.'; el.classList.remove('hidden'); return; }

  const item = items.find(i => i.id === selectedItemId);
  if (!item) return;

  const cur     = item.current_stock ?? item.currentStock ?? 0;
  const newStock = txType === 'in' ? cur + qty : cur - qty;

  if (txType === 'out' && newStock < 0) {
    el.textContent = `출고 수량이 현재고(${cur})를 초과합니다.`;
    el.classList.remove('hidden');
    return;
  }

  // 재고 업데이트
  const { error: updateErr } = await sb
    .from('items')
    .update({ current_stock: newStock })
    .eq('id', selectedItemId);

  if (updateErr) { el.textContent = updateErr.message; el.classList.remove('hidden'); return; }

  // 거래 내역 기록
  await sb.from('transactions').insert({
    item_id:    selectedItemId,
    item_name:  item.name,
    type:       txType,
    quantity:   qty,
    stock_after: newStock,
    handler:    v('txHandler').trim() || null,
    note:       v('txNote').trim()    || null
  });

  showToast(`${item.name} ${txType === 'in' ? '입고' : '출고'} ${qty}${item.unit||''} 완료!`);
  ['txSearch','txQty','txHandler','txNote'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('txQty').value = 1;
  document.getElementById('txPreview').classList.add('hidden');
  selectedItemId = null;
  await loadAll();
}

/* ─── 거래 내역 렌더링 ─── */
function renderHistory() {
  const q    = v('histSearch').toLowerCase();
  const type = v('histTypeFilter');
  const filtered = transactions.filter(tx =>
    (!q    || tx.item_name?.toLowerCase().includes(q)) &&
    (!type || tx.type === type)
  );

  const tbody = document.getElementById('historyBody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-400">거래 내역이 없습니다.</td></tr>';
    return;
  }
  tbody.innerHTML = filtered.map(tx => `
    <tr class="border-t border-gray-100">
      <td class="px-4 py-3 font-medium text-gray-900">${esc(tx.item_name||'')}</td>
      <td class="px-4 py-3 text-center">
        ${tx.type === 'in'
          ? '<span class="badge-in px-2 py-0.5 rounded text-xs">입고</span>'
          : '<span class="badge-out px-2 py-0.5 rounded text-xs">출고</span>'}
      </td>
      <td class="px-4 py-3 text-right font-semibold">${tx.quantity}</td>
      <td class="px-4 py-3 text-right text-gray-600">${tx.stock_after ?? '-'}</td>
      <td class="px-4 py-3 text-gray-500">${esc(tx.handler||'-')}</td>
      <td class="px-4 py-3 text-gray-400 text-xs">${esc(tx.note||'-')}</td>
    </tr>`).join('');
}

/* ─── 삭제 ─── */
function confirmDelete(id, name) {
  pendingDeleteId = id;
  document.getElementById('deleteItemName').textContent = name;
  show('deleteModal');
}
async function doDelete() {
  if (!pendingDeleteId) return;
  await sb.from('transactions').delete().eq('item_id', pendingDeleteId);
  const { error } = await sb.from('items').delete().eq('id', pendingDeleteId);
  if (error) { showToast('삭제 실패: ' + error.message); }
  else        { showToast('삭제되었습니다.'); }
  closeModal('deleteModal');
  pendingDeleteId = null;
  await loadAll();
}

/* ─── 탭 전환 ─── */
function switchTab(tab, btn) {
  ['inventory','register','transaction','history'].forEach(t => {
    document.getElementById('tab-' + t)?.classList.add('hidden');
  });
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
  document.getElementById('tab-' + tab)?.classList.remove('hidden');
  btn.classList.add('tab-active');
}

/* ─── 유틸 ─── */
function show(id)    { document.getElementById(id)?.classList.remove('hidden'); }
function hide(id)    { document.getElementById(id)?.classList.add('hidden'); }
function v(id)       { return document.getElementById(id)?.value || ''; }
function esc(s)      { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showChangePw() { show('changePwModal'); }
function closeModal(id) { hide(id); }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 3000);
}

// 드롭다운 외부 클릭 닫기
document.addEventListener('click', e => {
  if (!e.target.closest('#txSearch') && !e.target.closest('#txDropdown')) {
    document.getElementById('txDropdown')?.classList.add('hidden');
  }
});
</script>
