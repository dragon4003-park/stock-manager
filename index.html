    <script>
        (function () {
            var today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            var url = new URL(window.location.href);
            if (url.searchParams.get('v') !== today) {
                url.searchParams.set('v', today);
                window.location.replace(url.toString());
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {

<script>
const SUPABASE_URL = 'https://hjtfrbwakcjpqcrztpij.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqdGZyYndha2NqcHFjcnp0cGlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NDYxNTUsImV4cCI6MjA5NTUyMjE1NX0.8d8bkHFYFV8BrR4kR-OHg3NiOTqBiXDPdeTM5q513RA';

let allItems = [];

/* ── 유틸 ─────────────────────────────────────────── */
function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = isError ? '#dc2626' : '#1e293b';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function fmtDate(d) {
    if (!d) return '-';
    return new Date(d).toLocaleDateString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function setHeaderDate() {
    document.getElementById('headerDate').textContent =
        new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
}

/* ── 탭 전환 ────────────────────────────────────────── */
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    renderTab(tab);
}

async function renderTab(tab) {
    const main = document.getElementById('mainContent');
    main.innerHTML = '<div class="flex items-center justify-center h-40"><div class="text-gray-400 text-sm animate-pulse">불러오는 중...</div></div>';
    if (tab === 'inventory')    await renderInventory();
    else if (tab === 'register')    await renderRegister();
    else if (tab === 'transaction') await renderTransaction();
    else if (tab === 'history')     await renderHistory();
}

/* ══════════════════════════════════════════════════════
   1. 재고 현황
══════════════════════════════════════════════════════ */
async function renderInventory() {
    const { data, error } = await sb.from('items').select('*').order('name');
    if (error) { showToast('데이터 로드 실패', true); return; }
    allItems = data || [];

    const cats = ['전체', ...new Set(allItems.map(i => i.category).filter(Boolean))];
    const lowStock = allItems.filter(i => i.quantity <= (i.min_stock || 0));

    const main = document.getElementById('mainContent');
    main.innerHTML = `
        ${lowStock.length ? `
        <div class="bg-red-50 border border-red-200 rounded-lg p-3 mb-3">
            <p class="text-red-700 text-xs font-semibold mb-1">재고 부족 항목 ${lowStock.length}개</p>
            <p class="text-red-600 text-xs">${lowStock.map(i=>i.name).join(', ')}</p>
        </div>` : ''}

        <div class="flex gap-2 mb-3 overflow-x-auto pb-1 scrollbar-hide">
            ${cats.map((c,i) => `
            <button onclick="filterCat(this, '${c}')"
                class="cat-btn flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border transition-colors
                ${i===0 ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-300'}">${c}</button>
            `).join('')}
        </div>

        <div id="itemCards" class="space-y-2">
            ${renderItemCards(allItems)}
        </div>
    `;
}

function renderItemCards(items) {
    if (!items.length) return '<div class="text-center text-gray-400 py-10 text-sm">항목이 없습니다</div>';
    return items.map(item => {
        const low = item.quantity <= (item.min_stock || 0);
        return `
        <div class="bg-white rounded-xl border ${low ? 'border-red-200' : 'border-gray-200'} p-3.5">
            <div class="flex items-start justify-between mb-2">
                <div class="flex-1 min-w-0">
                    <p class="font-semibold text-gray-800 text-sm truncate">${item.name}</p>
                    <p class="text-xs text-gray-400 mt-0.5">${item.category || ''}${item.location ? ' · ' + item.location : ''}</p>
                </div>
                <div class="text-right ml-3 flex-shrink-0">
                    <p class="text-lg font-bold ${low ? 'text-red-600' : 'text-blue-600'}">${item.quantity}</p>
                    <p class="text-xs text-gray-400">${item.unit || ''}</p>
                </div>
            </div>
            ${item.min_stock ? `
            <div class="flex items-center gap-2 mt-2">
                <div class="flex-1 bg-gray-100 rounded-full h-1.5">
                    <div class="h-1.5 rounded-full ${low ? 'bg-red-400' : 'bg-blue-500'} transition-all"
                         style="width:${Math.min(100, Math.round(item.quantity / (item.min_stock * 3) * 100))}%"></div>
                </div>
                <p class="text-xs text-gray-400 flex-shrink-0">최소 ${item.min_stock}</p>
            </div>` : ''}
            <div class="flex gap-2 mt-3">
                <button onclick="quickTransaction(${item.id}, 'in', '${item.name.replace(/'/g,"\'")}', ${item.quantity})"
                    class="flex-1 bg-green-50 text-green-700 text-xs font-medium py-2 rounded-lg border border-green-200 active:bg-green-100">
                    + 입고
                </button>
                <button onclick="quickTransaction(${item.id}, 'out', '${item.name.replace(/'/g,"\'")}', ${item.quantity})"
                    class="flex-1 bg-red-50 text-red-700 text-xs font-medium py-2 rounded-lg border border-red-200 active:bg-red-100">
                    - 출고
                </button>
                <button onclick="deleteItem(${item.id}, '${item.name.replace(/'/g,"\'")}' )"
                    class="bg-gray-50 text-gray-400 text-xs py-2 px-3 rounded-lg border border-gray-200 active:bg-gray-100">
                    삭제
                </button>
            </div>
        </div>`;
    }).join('');
}

function filterCat(btn, cat) {
    document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = b.className.replace(/bg-blue-600 text-white border-blue-600/, '').trim();
        b.classList.add('bg-white', 'text-gray-600', 'border-gray-300');
    });
    btn.classList.remove('bg-white', 'text-gray-600', 'border-gray-300');
    btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
    const filtered = cat === '전체' ? allItems : allItems.filter(i => i.category === cat);
    document.getElementById('itemCards').innerHTML = renderItemCards(filtered);
}

async function quickTransaction(itemId, type, itemName, currentQty) {
    const qty = prompt(`${itemName} ${type === 'in' ? '입고' : '출고'} 수량을 입력하세요:`);
    if (!qty || isNaN(qty) || Number(qty) <= 0) return;
    const n = Number(qty);
    if (type === 'out' && n > currentQty) {
        showToast(`재고 부족! 현재 재고: ${currentQty}`, true); return;
    }
    const newQty = type === 'in' ? currentQty + n : currentQty - n;
    const { error: e1 } = await sb.from('items').update({ quantity: newQty }).eq('id', itemId);
    if (e1) { showToast('오류 발생', true); return; }
    const { error: e2 } = await sb.from('transactions').insert({
        item_id: itemId, type, quantity: n,
        date: new Date().toISOString(), note: '빠른' + (type==='in'?'입고':'출고')
    });
    if (e2) console.warn('트랜잭션 저장 오류', e2);
    showToast(`${type === 'in' ? '입고' : '출고'} 완료! (${n}${'개'})`);;
    renderInventory();
}

async function deleteItem(id, name) {
    if (!confirm(`"${name}"을 삭제하시겠습니까?`)) return;
    const { error } = await sb.from('items').delete().eq('id', id);
    if (error) { showToast('삭제 실패', true); return; }
    showToast('삭제 완료');
    renderInventory();
}

/* ══════════════════════════════════════════════════════
   2. 소모품 등록
══════════════════════════════════════════════════════ */
async function renderRegister() {
    const { data: items } = await sb.from('items').select('category').order('category');
    const cats = [...new Set((items||[]).map(i=>i.category).filter(Boolean))];

    document.getElementById('mainContent').innerHTML = `
        <div class="bg-white rounded-xl border border-gray-200 p-4">
            <h2 class="font-bold text-gray-800 mb-4">소모품 등록</h2>
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-medium text-gray-500 mb-1 block">품목명 *</label>
                    <input id="reg_name" type="text" placeholder="예: 에탄올 99%"
                        class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="text-xs font-medium text-gray-500 mb-1 block">카테고리</label>
                    <input id="reg_category" type="text" placeholder="예: 시약, 소모품"
                        list="cat_list"
                        class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <datalist id="cat_list">
                        ${cats.map(c => `<option value="${c}">`).join('')}
                    </datalist>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-medium text-gray-500 mb-1 block">현재 수량</label>
                        <input id="reg_quantity" type="number" placeholder="0" min="0"
                            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-gray-500 mb-1 block">단위</label>
                        <input id="reg_unit" type="text" placeholder="개, mL, box"
                            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-medium text-gray-500 mb-1 block">최소 재고</label>
                        <input id="reg_min_stock" type="number" placeholder="0" min="0"
                            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-gray-500 mb-1 block">보관 위치</label>
                        <input id="reg_location" type="text" placeholder="예: 냉장고 A"
                            class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-medium text-gray-500 mb-1 block">메모</label>
                    <textarea id="reg_note" rows="2" placeholder="기타 정보"
                        class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
                </div>
                <button onclick="submitRegister()"
                    class="w-full bg-blue-600 text-white font-medium py-3 rounded-lg text-sm active:bg-blue-700 mt-1">
                    등록하기
                </button>
            </div>
        </div>
    `;
}

async function submitRegister() {
    const name = document.getElementById('reg_name').value.trim();
    if (!name) { showToast('품목명을 입력하세요', true); return; }
    const payload = {
        name,
        category: document.getElementById('reg_category').value.trim() || null,
        quantity: parseInt(document.getElementById('reg_quantity').value) || 0,
        unit:     document.getElementById('reg_unit').value.trim() || null,
        min_stock: parseInt(document.getElementById('reg_min_stock').value) || 0,
        location: document.getElementById('reg_location').value.trim() || null,
        description: document.getElementById('reg_note').value.trim() || null,
    };
    const { error } = await sb.from('items').insert(payload);
    if (error) { showToast('등록 실패: ' + error.message, true); return; }
    showToast('등록 완료!');
    renderRegister();
}

/* ══════════════════════════════════════════════════════
   3. 입출고
══════════════════════════════════════════════════════ */
async function renderTransaction() {
    const { data: items } = await sb.from('items').select('id, name, quantity, unit').order('name');
    allItems = items || [];

    document.getElementById('mainContent').innerHTML = `
        <div class="bg-white rounded-xl border border-gray-200 p-4">
            <h2 class="font-bold text-gray-800 mb-4">입출고 등록</h2>
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-medium text-gray-500 mb-1 block">품목 선택 *</label>
                    <select id="tx_item"
                        class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="">-- 품목을 선택하세요 --</option>
                        ${allItems.map(i => `<option value="${i.id}" data-qty="${i.quantity}" data-unit="${i.unit||''}">${i.name} (현재: ${i.quantity}${i.unit||''} )</option>`).join('')}
                    </select>
                </div>
                <div>
                    <label class="text-xs font-medium text-gray-500 mb-2 block">구분 *</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="selectType('in')" id="btn_in"
                            class="py-3 rounded-lg border-2 border-green-500 bg-green-50 text-green-700 font-medium text-sm">
                            입고
                        </button>
                        <button onclick="selectType('out')" id="btn_out"

                        </button>
                    </div>
                    <input type="hidden" id="tx_type" value="in">
                </div>
                <div>
                    <label class="text-xs font-medium text-gray-500 mb-1 block">수량 *</label>

                <div>
                    <label class="text-xs font-medium text-gray-500 mb-1 block">담당자</label>

                <button onclick="submitTransaction()"

function selectType(type) {
    document.getElementById('tx_type').value = type;
    const inBtn  = document.getElementById('btn_in');
    const outBtn = document.getElementById('btn_out');
    if (type === 'in') {
        inBtn.className  = 'py-3 rounded-lg border-2 border-green-500 bg-green-50 text-green-700 font-medium text-sm';
        outBtn.className = 'py-3 rounded-lg border-2 border-gray-200 text-gray-400 font-medium text-sm';
    } else {
        outBtn.className = 'py-3 rounded-lg border-2 border-red-500 bg-red-50 text-red-700 font-medium text-sm';
        inBtn.className  = 'py-3 rounded-lg border-2 border-gray-200 text-gray-400 font-medium text-sm';
    }
}

async function submitTransaction() {
    const itemId = document.getElementById('tx_item').value;
    const type   = document.getElementById('tx_type').value;
    const qty    = parseInt(document.getElementById('tx_qty').value);
    const user   = document.getElementById('tx_user').value.trim();
    const note   = document.getElementById('tx_note').value.trim();

    if (!itemId) { showToast('품목을 선택하세요', true); return; }
    if (!qty || qty <= 0) { showToast('수량을 입력하세요', true); return; }

    const sel = document.getElementById('tx_item');
    const opt = sel.options[sel.selectedIndex];
    const currentQty = parseInt(opt.dataset.qty) || 0;

    if (type === 'out' && qty > currentQty) {
        showToast(`재고 부족! 현재 재고: ${currentQty}`, true); return;
    }

    const newQty = type === 'in' ? currentQty + qty : currentQty - qty;
    const { error: e1 } = await sb.from('items').update({ quantity: newQty }).eq('id', itemId);
    if (e1) { showToast('수량 업데이트 실패', true); return; }

    const { error: e2 } = await sb.from('transactions').insert({
        item_id: parseInt(itemId), type, quantity: qty,
        date: new Date().toISOString(),
        user_name: user || null,
        note: note || null
    });
    if (e2) console.warn('트랜잭션 저장 오류', e2);
    showToast(`${type === 'in' ? '입고' : '출고'} 완료!`);
    renderTransaction();
}

/* ══════════════════════════════════════════════════════
   4. 거래 내역
══════════════════════════════════════════════════════ */
async function renderHistory() {
    const { data, error } = await sb
        .from('transactions')
        .select('*, items(name, unit)')
        .order('id', { ascending: false })
        .limit(100);

    if (error) { showToast('내역 로드 실패', true); return; }
    const list = data || [];

    document.getElementById('mainContent').innerHTML = `
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-bold text-gray-800">입출고 내역</h2>
            <span class="text-xs text-gray-400">최근 ${list.length}건</span>
        </div>
        ${!list.length
            ? '<div class="text-center text-gray-400 py-16 text-sm">내역이 없습니다</div>'
            : '<div class="space-y-2">' + list.map(tx => `
            <div class="bg-white rounded-xl border border-gray-200 p-3.5">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="badge-${tx.type} text-xs font-semibold px-2 py-0.5 rounded flex-shrink-0">
                            ${tx.type === 'in' ? '입고' : '출고'}
                        </span>
                        <p class="text-sm font-medium text-gray-800 truncate">
                            ${tx.items ? tx.items.name : '삭제된 품목'}
                        </p>
                    </div>
                    <p class="text-sm font-bold ${tx.type==='in'?'text-green-600':'text-red-600'} flex-shrink-0 ml-2">
                        ${tx.type==='in'?'+':'-'}${tx.quantity}${tx.items?.unit||''} 
                    </p>
                </div>
                <div class="flex items-center justify-between mt-1.5">
                    <p class="text-xs text-gray-400">${fmtDate(tx.date)}</p>
                    <p class="text-xs text-gray-400">${[tx.user_name, tx.note].filter(Boolean).join(' · ') || ''}</p>
                </div>
            </div>`).join('')+'</div>'
        }
    `;
}

/* ── 초기화 ────────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
    setHeaderDate();
    renderTab('inventory');
});
</script>
